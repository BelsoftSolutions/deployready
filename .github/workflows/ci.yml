name: CI

# Runs the checks CONTRIBUTING.md asks contributors to run locally
# (`npm test` and `npm run lint`) automatically on every push and PR,
# so review doesn't depend on a human re-running them by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Test
        run: npm test
