name: Publish to npm

# Publishes when you create a GitHub Release.
# Auth is via npm "trusted publishing" (OIDC) — no token/secret is stored anywhere.
# package.json "version" must match the release tag (checked below). Pre-releases publish under the "beta" tag.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # REQUIRED for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: intentionally NO `registry-url` here. setup-node's registry-url
      # writes an .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and `always-auth=true`; with OIDC there's no token, so npm tries the empty
      # token and fails with 404 instead of using the trusted-publisher handshake.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24 ships a recent npm; try to upgrade, but do not
      # fail the release if the self-upgrade itself fails, then verify the version that will actually publish.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest || echo "npm self-upgrade failed; continuing with the bundled npm"
          npm --version

      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" || { echo "::error::npm >= 11.5.1 is required for trusted publishing"; exit 1; }

      # Fail early if package.json does not match the release tag (v0.3.0 or 0.3.0).
      - name: Check version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN needed: npm detects the OIDC environment and
      # publishes via the trusted publisher you configure on npmjs.com.
      # Provenance attestation is generated automatically.
      # Pre-releases (GitHub "pre-release" checkbox) and any version with a hyphen
      # (for example 0.4.0-beta.1) go out under the "beta" dist-tag so they can never become "latest".
      - name: Publish
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          case "$PKG_VERSION" in
            *-*) HAS_HYPHEN=true ;;
            *) HAS_HYPHEN=false ;;
          esac
          if [ "$IS_PRERELEASE" = "true" ] || [ "$HAS_HYPHEN" = "true" ]; then
            npm publish --tag beta
          else
            npm publish
          fi
