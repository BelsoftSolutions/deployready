# Example workflow: DeployReady as a GitHub Action.
# Copy to .github/workflows/deployready.yml. See docs/GITHUB-ACTION.md.
#
# Static scan only (no AI, no live app): deterministic, no secrets needed.
# Fails the job (exit code 2) on any CRITICAL finding, comments once on the PR,
# and uploads SARIF to GitHub code scanning.

name: DeployReady

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # SARIF upload (sarif: true)
  pull-requests: write     # sticky PR comment (comment: true)

jobs:
  deployready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: BelsoftSolutions/deployready@v0.6.0
        with:
          path: .
          fail-on: critical     # critical | warning | info | none
          version: 0.4.0        # npm version of the CLI, or latest
          comment: true
          sarif: true
