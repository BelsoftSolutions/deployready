<text x="410.0" y="23" text-anchor="middle" fill="#8b949e" style="font-size:12px">deployready — flask-demo (real run, DeployReady 0.4.0)</text>
<g class="sc sc0">
<g class="l0"><text x="24" y="58" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#ffffff">npx deployready@latest analyze ./flask-demo --no-ai --no-dynamic</tspan></text>
<rect class="c1" x="24" y="44" width="514.8" height="19" fill="#0d1117"/>
</g>
<g class="l1"><text x="24" y="77" xml:space="preserve" textLength="429.0" lengthAdjust="spacing"><tspan fill="#3fb950">✔ Static analysis done — 1 files, 2 routes, 4 findings.</tspan></text>
</g>
<g class="l2"><text x="24" y="96" xml:space="preserve" textLength="202.8" lengthAdjust="spacing"><tspan fill="#ffffff">  DeployReady Scan Results</tspan></text>
</g>
<g class="l3"><text x="24" y="115" xml:space="preserve" textLength="280.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">  Production Readiness Score: </tspan><tspan fill="#e3b341">48/100</tspan></text>
</g>
<g class="l4"><text x="24" y="134" xml:space="preserve" textLength="413.4" lengthAdjust="spacing"><tspan fill="#8b949e">  Stack: unknown (unknown)  ·  Files: 1  ·  Routes: 2</tspan></text>
</g>
<g class="l5"><text x="24" y="153" xml:space="preserve" textLength="109.2" lengthAdjust="spacing"><tspan fill="#ff7b72">● CRITICAL (3)</tspan></text>
</g>
<g class="l6"><text x="24" y="172" xml:space="preserve" textLength="608.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">  1. Hardcoded Flask/Django SECRET_KEY (anyone can forge sessions)  — app.py:6</tspan></text>
</g>
<g class="l7"><text x="24" y="191" xml:space="preserve" textLength="335.4" lengthAdjust="spacing"><tspan fill="#8b949e">     A02:2025 CWE-798  ·  CRITICAL [static]</tspan></text>
</g>
<g class="l8"><text x="24" y="210" xml:space="preserve" textLength="452.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">  2. TLS verification disabled (verify=False)  — app.py:22</tspan></text>
</g>
<g class="l9"><text x="24" y="229" xml:space="preserve" textLength="335.4" lengthAdjust="spacing"><tspan fill="#8b949e">     A04:2025 CWE-295  ·  CRITICAL [static]</tspan></text>
</g>
<g class="l10"><text x="24" y="248" xml:space="preserve" textLength="538.2" lengthAdjust="spacing"><tspan fill="#c9d1d9">  3. SQL built with an f-string / format (SQL injection)  — app.py:16</tspan></text>
</g>
<g class="l11"><text x="24" y="267" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#8b949e">     A05:2025 CWE-89  ·  CRITICAL [static]</tspan></text>
</g>
<g class="l12"><text x="24" y="286" xml:space="preserve" textLength="702.0" lengthAdjust="spacing"><tspan fill="#79c0ff">     evidence: cur = get_db().execute(f"SELECT id, name FROM users WHERE name = '{name}'")</tspan></text>
</g>
<g class="l13"><text x="24" y="305" xml:space="preserve" textLength="101.4" lengthAdjust="spacing"><tspan fill="#e3b341">● WARNING (1)</tspan></text>
</g>
<g class="l14"><text x="24" y="324" xml:space="preserve" textLength="499.2" lengthAdjust="spacing"><tspan fill="#c9d1d9">  1. Flask debug mode enabled (app.run(debug=True))  — app.py:27</tspan></text>
</g>
<g class="l15"><text x="24" y="343" xml:space="preserve" textLength="327.6" lengthAdjust="spacing"><tspan fill="#8b949e">     A02:2025 CWE-489  ·  WARNING [static]</tspan></text>
</g>
<g class="l16"><text x="24" y="362" xml:space="preserve" textLength="304.2" lengthAdjust="spacing"><tspan fill="#ffffff">Summary: 3 critical, 1 warnings, 0 info</tspan></text>
</g>
</g>
<g class="sc sc1">
<g class="l17"><text x="24" y="58" xml:space="preserve" textLength="608.4" lengthAdjust="spacing"><tspan fill="#3fb950">$ </tspan><tspan fill="#ffffff">npx deployready@latest analyze ./flask-demo --no-ai --no-dynamic --fix --yes</tspan></text>
<rect class="c18" x="24" y="44" width="608.4" height="19" fill="#0d1117"/>
</g>
<g class="l18"><text x="24" y="77" xml:space="preserve" textLength="577.2" lengthAdjust="spacing"><tspan fill="#8b949e">… same scan output as before (elided): score 48/100, 3 critical, 1 warning</tspan></text>
</g>
<g class="l19"><text x="24" y="96" xml:space="preserve" textLength="475.8" lengthAdjust="spacing"><tspan fill="#3fb950">✓ Fixed: TLS verification disabled (verify=False) (app.py:22)</tspan></text>
</g>
<g class="l20"><text x="24" y="115" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#8b949e">  backup: .deployready/backups/app.py.2026-11-27T20-43-55-765Z.bak</tspan></text>
</g>
<g class="l21"><text x="24" y="134" xml:space="preserve" textLength="522.6" lengthAdjust="spacing"><tspan fill="#3fb950">✓ Fixed: Flask debug mode enabled (app.run(debug=True)) (app.py:27)</tspan></text>
</g>
<g class="l22"><text x="24" y="153" xml:space="preserve" textLength="514.8" lengthAdjust="spacing"><tspan fill="#8b949e">  backup: .deployready/backups/app.py.2026-11-27T20-43-55-768Z.bak</tspan></text>
</g>
<g class="l23"><text x="24" y="172" xml:space="preserve" textLength="148.2" lengthAdjust="spacing"><tspan fill="#8b949e">- Parsing codebase…</tspan></text>
</g>
<g class="l24"><text x="24" y="191" xml:space="preserve" textLength="429.0" lengthAdjust="spacing"><tspan fill="#3fb950">✔ Static analysis done — 1 files, 2 routes, 2 findings.</tspan></text>
</g>
<g class="l25"><text x="24" y="210" xml:space="preserve" textLength="351.0" lengthAdjust="spacing"><tspan fill="#3fb950">✓ Re-scanned after 2 fix(es): </tspan><tspan fill="#e3b341">score 48 -&gt; 60.</tspan></text>
</g>
</g>
<g class="sc sc2">
<g class="l26"><text x="24" y="58" xml:space="preserve" textLength="171.6" lengthAdjust="spacing"><tspan fill="#79c0ff">deployready › </tspan><tspan fill="#ffffff">prompt 1</tspan></text>
<rect class="c27" x="24" y="44" width="171.6" height="19" fill="#0d1117"/>
</g>
<g class="l27"><text x="24" y="77" xml:space="preserve" textLength="280.8" lengthAdjust="spacing"><tspan fill="#8b949e">  Paste this into your coding agent:</tspan></text>
</g>
<g class="l28"><text x="24" y="96" xml:space="preserve" textLength="569.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">  Fix one critical security issue that DeployReady found in this project.</tspan></text>
</g>
<g class="l29"><text x="24" y="115" xml:space="preserve" textLength="132.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">  Where: app.py:6</tspan></text>
</g>
<g class="l30"><text x="24" y="134" xml:space="preserve" textLength="702.0" lengthAdjust="spacing"><tspan fill="#c9d1d9">  Issue: Hardcoded Flask/Django SECRET_KEY (anyone can forge sessions) (CWE-798, A02:2025)</tspan></text>
</g>
<g class="l31"><text x="24" y="153" xml:space="preserve" textLength="678.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">  What to change: The session-signing key is in source, so anyone who sees the code can</tspan></text>
</g>
<g class="l32"><text x="24" y="172" xml:space="preserve" textLength="678.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">  forge session cookies and log in as any user. Load it from an environment variable or</tspan></text>
</g>
<g class="l33"><text x="24" y="191" xml:space="preserve" textLength="475.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">  secret manager, use a long random value, and rotate it now.</tspan></text>
</g>
<g class="l34"><text x="24" y="210" xml:space="preserve" textLength="670.8" lengthAdjust="spacing"><tspan fill="#c9d1d9">  Keep the fix minimal: change only what this issue needs, … never put real secrets in</tspan></text>
</g>
<g class="l35"><text x="24" y="229" xml:space="preserve" textLength="405.6" lengthAdjust="spacing"><tspan fill="#c9d1d9">  code or in your reply (use environment variables).</tspan></text>
</g>
<g class="l36"><text x="24" y="248" xml:space="preserve" textLength="647.4" lengthAdjust="spacing"><tspan fill="#c9d1d9">  To confirm: re-run `npx deployready@latest analyze` … or call the DeployReady MCP</tspan></text>
</g>
<g class="l37"><text x="24" y="267" xml:space="preserve" textLength="304.2" lengthAdjust="spacing"><tspan fill="#c9d1d9">  `verify` tool with id "09b902e3fda5".</tspan></text>
</g>
</g>
</svg>