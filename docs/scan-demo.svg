<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 397" width="820" height="397" role="img" aria-labelledby="t d">
<title id="t">DeployReady scanning a vulnerable Flask app, fixing it, and printing a fix prompt</title>
<desc id="d">Animated terminal: a scan finds 3 critical issues and 1 warning (score 48/100), analyze --fix applies 2 safe fixes and the score rises to 60/100, then a fix prompt for the hardcoded SECRET_KEY is printed.</desc>
<!--
  Recording notes (read me): this is a REAL session, not a mock-up. Target: benchmark/corpus/vibe/flask-debug-sqli-tp
  (copied to a scratch dir and called ./flask-demo here), DeployReady 0.4.0, run with
  `node dist/index.js analyze <dir>` with the flags no-ai and no-dynamic (and fix + yes for step 2) and the interactive command `prompt 1`.
  Text is the real printed output, with these edits only: paths shortened, the per-finding `fix:` lines and the
  repeated scan output in the second step elided, emoji bullets replaced by plain circles, one long line wrapped,
  and the fix prompt shortened with "…" where marked. Colors are added by this file (the terminal was run with NO_COLOR).
  Animation is pure CSS; no scripts and no external fonts. Source script is not part of the repo; edit the text by hand if output changes.
-->
